# GitHub Actions workflow for Moodle plugin CI (Enhanced Marketplace Standard).
name: Moodle Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_405_STABLE']
        php: ['8.1', '8.2', '8.3']

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: question/bank/comp_ext

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mbstring, gd, curl, xml, zip, intl, sodium
          ini-values: max_execution_time=600, memory_limit=512M, max_input_vars=5000
          tools: composer:v2

      - name: Setup System Locales
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Setup Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin question/bank/comp_ext --db-host=127.0.0.1 --db-user=postgres --db-name=moodle_ci_db --db-pass="" --db-type=pgsql
        env:
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint question/bank/comp_ext

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: PHP CodeSniffer (Moodle Coding Style)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker question/bank/comp_ext

      - name: PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc question/bank/comp_ext

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Moodle PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Moodle Behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat
