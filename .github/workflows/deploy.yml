name: Deploy to Moodle Staging

on:
  push:
    branches: [main, master]

env:
  PLUGIN_PATH: question/bank/competency

jobs:
  deploy:
    name: 🚀 Deploy competency qbank → Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add staging to known_hosts
        run: ssh-keyscan -H 80.225.79.61 >> ~/.ssh/known_hosts

      - name: Deploy plugin files
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ ubuntu@80.225.79.61:/home/ubuntu/moodle-staging/${{ env.PLUGIN_PATH }}/

      - name: Upgrade Moodle & clear caches
        run: |
          ssh ubuntu@80.225.79.61 "
            docker exec moodle-staging-app \
              php /var/www/html/admin/cli/upgrade.php --non-interactive 2>&1 | tail -3
            docker exec moodle-staging-app \
              php /var/www/html/admin/cli/purge_caches.php
            echo '✅ competency qbank deployed to staging!'
          "
